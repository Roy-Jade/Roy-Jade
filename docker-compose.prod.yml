services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend.prod
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
    container_name: portfolio-backend
    env_file: ./backend/.env.prod
    restart: unless-stopped
    networks:
      - portfolio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend.prod
    ports:
      - 80:80
    depends_on:
      - backend
    container_name: portfolio-frontend
    restart: unless-stopped
    networks:
      - portfolio

  db:
    image: postgres:17
    container_name: portfolio-database
    env_file: ./.env.prod.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend/conception:/docker-entrypoint-initdb.d
      - pg-portfolio:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - portfolio

volumes:
  pg-portfolio:

networks:
  portfolio:
    driver: bridge
